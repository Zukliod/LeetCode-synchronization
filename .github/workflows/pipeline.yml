name: Automated Portfolio Engine

on:
  schedule:
    - cron: '0 18 * * *' # Runs daily at 18:00 UTC
  workflow_dispatch: # Manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown xhtml2pdf

      - name: Run Pipeline & Generate PDF Variants
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LEETCODE_USERNAME: "zukliod"
        run: python update_linkedin.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.md Harshit_FullStack_Resume.pdf Harshit_Backend_Resume.pdf
          git diff --staged --quiet || (git commit -m "chore(auto): update metrics & recompile PDF variants [skip ci]" && git push)
