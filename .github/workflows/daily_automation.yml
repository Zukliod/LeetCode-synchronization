name: Daily Portfolio & Resume Automation

on:
  schedule:
    # Runs every day at 18:00 UTC (11:30 PM IST)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  update-resume-and-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install requests google-generativeai markdown pdfkit xhtml2pdf pypdf pillow

      - name: Install wkhtmltopdf for PDF compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Fetch Latest MERN & AI GitHub Projects
        run: python LinkedIn-synchronization/update_resume_projects.py

      - name: Run Daily LinkedIn & Resume Stats Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          if [ -f "update_linkedin.py" ]; then
            python update_linkedin.py
          fi

      - name: Compile Resumes to PDF
        run: |
          python -c "
          import markdown, pdfkit, os

          if os.path.exists('LinkedIn-synchronization/  resume.md'):
              with open('resume.md', 'r', encoding='utf-8') as f:
                  html_text = markdown.markdown(f.read())
              
              styled_html = f'''
              <html>
              <head>
                <style>
                  body {{ font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; line-height: 1.5; color: #111; margin: 30px; }}
                  h1 {{ font-size: 22px; margin-bottom: 2px; text-transform: uppercase; color: #0f172a; }}
                  h3 {{ font-size: 13px; border-bottom: 1.5px solid #0f172a; padding-bottom: 2px; margin-top: 16px; margin-bottom: 8px; color: #1e293b; text-transform: uppercase; letter-spacing: 0.5px; }}
                  p {{ margin: 3px 0; }}
                  ul {{ margin: 4px 0 8px 18px; padding: 0; }}
                  li {{ margin-bottom: 3px; }}
                  a {{ color: #2563eb; text-decoration: none; }}
                  hr {{ border: none; border-top: 1px solid #cbd5e1; margin: 12px 0; }}
                </style>
              </head>
              <body>{html_text}</body>
              </html>
              '''
              
              options = {'page-size': 'A4', 'margin-top': '0.4in', 'margin-right': '0.4in', 'margin-bottom': '0.4in', 'margin-left': '0.4in', 'encoding': 'UTF-8'}
              pdfkit.from_string(styled_html, 'Harshit_FullStack_Resume.pdf', options=options)
              pdfkit.from_string(styled_html, 'Harshit_Backend_Resume.pdf', options=options)
          "

      - name: Commit and Push Updated Files & PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.md Harshit_FullStack_Resume.pdf Harshit_Backend_Resume.pdf || true
          git diff-index --quiet HEAD || git commit -m "Auto-update resume projects and PDFs [skip ci]"
          git push
