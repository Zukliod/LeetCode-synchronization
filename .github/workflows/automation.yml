name: Portfolio Automation

on:
  schedule:
    # Every day at 6:00 PM UTC (11:30 PM IST)
    - cron: '0 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-automation
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
  LEETCODE_USERNAME: zukliod

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Update Resume Projects
        run: |
          python update_resume_projects.py

      - name: Update Resume & Publish LinkedIn
        run: |
          python update_linkedin.py    

      - name: Verify Python
        run: |
          python --version
          pip --version

      - name: Verify Repository
        run: |
          pwd
          ls -la

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): daily portfolio update [skip ci]"
            git push
          fi
