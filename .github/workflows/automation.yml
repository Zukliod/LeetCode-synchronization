name: Daily Portfolio Automation

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 6:00 PM UTC (11:30 PM IST)
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: portfolio-automation
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Resume Projects
        run: python scripts/update_resume_projects.py

      - name: Run Daily Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: python scripts/main.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): daily portfolio update [skip ci]"
            git push
          fi
