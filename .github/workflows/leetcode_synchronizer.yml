name: LeetCode Synchronizer

on:
  workflow_dispatch: # Allows you to manually trigger it
  schedule:
    - cron: '0 17 * * *' # Automatically runs daily at 5:00 PM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Sync LeetCode Submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import json
          from datetime import datetime

          # 1. Setup Session
          session = requests.Session()
          session.cookies.set('LEETCODE_SESSION', os.getenv('LEETCODE_SESSION'), domain='.leetcode.com')
          session.cookies.set('csrftoken', os.getenv('LEETCODE_CSRF_TOKEN'), domain='.leetcode.com')
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
              'X-CSRFToken': os.getenv('LEETCODE_CSRF_TOKEN'),
              'Referer': 'https://leetcode.com'
          }

          # 2. GraphQL Query to fetch recent solved problems
          graphql_url = "https://leetcode.com"
          query = {
              "query": """
              query recentAcSubmissions($username: String!, $limit: Int!) {
                recentAcSubmissionList(username: $username, limit: $limit) {
                  id
                  title
                  titleSlug
                  timestamp
                }
              }
              """,
              "variables": {
                  "username": "zukliod",  # Your LeetCode username from the commit profile
                  "limit": 5
              }
          }

          try:
              response = session.post(graphql_url, json=query, headers=headers)
              if response.status_code == 200:
                  data = response.json()
                  submissions = data.get('data', {}).get('recentAcSubmissionList', [])
                  print(f"✅ Successfully fetched {len(submissions)} recent solved problems!")
                  
                  # Save summary data locally for the LinkedIn script to catch
                  with open('leetcode_last_sync.json', 'w') as f:
                      json.dump(submissions, f)
              else:
                  print(f"❌ Failed to reach LeetCode API: Status {response.status_code}")
                  exit(1)
          except Exception as e:
              print(f"❌ Error during sync: {e}")
              exit(1)
          EOF

      - name: Commit and Push Tracked Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add leetcode_last_sync.json
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Sync recent LeetCode activity [skip ci]"
          git push
